name: solvexa_mobile
description: Solvexa Mobile - Sistem Layanan Pengaduan Sarana & Prasarana Kampus Universitas Trilogi (100% Offline Local-First SQLite).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  sqflite: ^2.3.2
  path: ^1.9.0
  path_provider: ^2.1.2
  provider: ^6.1.2
  google_fonts: ^6.2.1
  mobile_scanner: ^5.1.1
  image_picker: ^1.1.2
  url_launcher: ^6.2.6
  intl: ^0.19.0
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/solvexa_seed.db
    - assets/images/
